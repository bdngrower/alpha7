name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/A7Foody.Service -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Publish (linux-x64, self-contained)
        run: dotnet publish src/A7Foody.Service -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish-linux
      - uses: actions/upload-artifact@v4
        with:
          name: A7FoodyConnector-win-x64
          path: publish
      - uses: actions/upload-artifact@v4
        with:
          name: A7FoodyConnector-linux-x64
          path: |
            publish-linux
            deploy/linux
